{% extends "base.html" %}
{% block title %}{% if member_id %}Edit member{% else %}Add member{% endif %}{% endblock %}

{% block content %}
<h1 class="h3 mb-3">{% if member_id %}Edit member #{{ member_id }}{% else %}Add member{% endif %}</h1>

<!-- One form used for both adding and editing; `member_id` is None when adding -->
<div class="card form-card">
  <div class="card-body">
    <form method="post"
          action="{% if member_id %}{{ url_for('edit_member', member_id=member_id) }}{% else %}{{ url_for('add_member') }}{% endif %}">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" class="form-control" required minlength="2" maxlength="100"
               value="{{ form.name }}">
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone (10 digits)</label>
        <input type="text" id="phone" name="phone" class="form-control" required
               pattern="[0-9]{10}" maxlength="10" inputmode="numeric" value="{{ form.phone }}">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" required maxlength="100"
               value="{{ form.email }}">
      </div>
      <div class="mb-3">
        <label for="join_date" class="form-label">Join date</label>
        <input type="date" id="join_date" name="join_date" class="form-control" required
               value="{{ form.join_date }}">
      </div>
      <button type="submit" class="btn btn-primary">{% if member_id %}Save changes{% else %}Add member{% endif %}</button>
      <a href="{{ url_for('members') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
